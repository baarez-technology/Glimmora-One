services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: glimmora
      POSTGRES_PASSWORD: glimmora
      POSTGRES_DB: glimmora
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glimmora"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://glimmora:glimmora@postgres:5432/glimmora
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-make-it-long}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-ChangeMe!2026}
      ALLOWED_ORIGINS: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      BACKEND_URL: http://api:8000
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-make-it-long}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pg_data:
  uploads:
