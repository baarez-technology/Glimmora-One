name: glimmora-one
region: blr

services:
  - name: api
    source_dir: backend
    github:
      repo: glimmora/glimmora-one
      branch: main
      deploy_on_push: true
    environment_slug: python
    build_command: pip install -e .
    run_command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    http_port: 8080
    routes:
      - path: /v1
      - path: /uploads
    health_check:
      http_path: /health
    envs:
      - key: DATABASE_URL
        type: SECRET
      - key: JWT_SECRET
        type: SECRET
      - key: BOOTSTRAP_SUPERADMIN_PASSWORD
        type: SECRET
      - key: OPENAI_API_KEY
        type: SECRET
      - key: ALLOWED_ORIGINS
        value: ${APP_URL}

  - name: web
    source_dir: /
    github:
      repo: glimmora/glimmora-one
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: corepack enable && pnpm install --frozen-lockfile && cd apps/web && pnpm run build
    run_command: cd apps/web && pnpm next start -p 8080
    http_port: 8080
    routes:
      - path: /
    envs:
      - key: BACKEND_URL
        value: ${api.PRIVATE_URL}
      - key: JWT_SECRET
        type: SECRET

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    source_dir: backend
    environment_slug: python
    build_command: pip install -e .
    run_command: alembic upgrade head
    envs:
      - key: DATABASE_URL
        type: SECRET
